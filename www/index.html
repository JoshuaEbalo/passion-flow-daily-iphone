/* ═══ FLOW WHEEL (MOBILE ONLY) ═══ */
function FlowWheel(p){
  var size=p.size||Math.min(window.innerWidth-40,380);
  var cx=size/2,cy=size/2,outerR=size*0.47,innerR=size*0.2;
  var sliceCount=CARDS.length;
  var sliceAngle=360/sliceCount;
  var _rot=useState(0),rotation=_rot[0],setRotation=_rot[1];
  var _dragging=useState(false),isDragging=_dragging[0],setIsDragging=_dragging[1];
  var dragStart=useRef(null);
  var dragRotStart=useRef(0);
  var velocity=useRef(0);
  var lastAngle=useRef(0);
  var lastTime=useRef(0);
  var animFrame=useRef(null);

  function getAngle(clientX,clientY,rect){
    var dx=clientX-rect.left-size/2;
    var dy=clientY-rect.top-size/2;
    return Math.atan2(dy,dx)*180/Math.PI;
  }

  // Momentum animation — spins with inertia after release
  useEffect(function(){
    var running=true;
    function tick(){
      if(!running)return;
      if(!isDragging){
        // Apply velocity with friction
        if(Math.abs(velocity.current)>0.05){
          setRotation(function(r){return r+velocity.current;});
          velocity.current*=0.96; // friction
        } else {
          // Gentle idle rotation
          velocity.current=0;
          setRotation(function(r){return r+0.08;});
        }
      }
      animFrame.current=requestAnimationFrame(tick);
    }
    animFrame.current=requestAnimationFrame(tick);
    return function(){running=false;if(animFrame.current)cancelAnimationFrame(animFrame.current);};
  },[isDragging]);

  // Shared start handler (touch + mouse)
  function startDrag(clientX,clientY,rect){
    var angle=getAngle(clientX,clientY,rect);
    dragStart.current=angle;
    dragRotStart.current=rotation;
    lastAngle.current=angle;
    lastTime.current=Date.now();
    velocity.current=0;
    setIsDragging(true);
  }
  function moveDrag(clientX,clientY,rect){
    if(!isDragging)return;
    var angle=getAngle(clientX,clientY,rect);
    var delta=angle-dragStart.current;
    setRotation(dragRotStart.current+delta);
    // Track velocity
    var now=Date.now();
    var dt=now-lastTime.current;
    if(dt>0){velocity.current=(angle-lastAngle.current)/dt*16;}
    lastAngle.current=angle;
    lastTime.current=now;
  }
  function endDrag(){setIsDragging(false);}

  // Touch handlers
  var handleTouchStart=function(e){
    var touch=e.touches[0];
    startDrag(touch.clientX,touch.clientY,e.currentTarget.getBoundingClientRect());
  };
  var handleTouchMove=function(e){
    if(!isDragging)return;
    var touch=e.touches[0];
    moveDrag(touch.clientX,touch.clientY,e.currentTarget.getBoundingClientRect());
  };
  var handleTouchEnd=function(){endDrag();};

  // Mouse handlers (desktop)
  var wheelRef=useRef(null);
  var handleMouseDown=function(e){
    e.preventDefault();
    startDrag(e.clientX,e.clientY,e.currentTarget.getBoundingClientRect());
  };
  useEffect(function(){
    function onMouseMove(e){
      if(!isDragging||!wheelRef.current)return;
      moveDrag(e.clientX,e.clientY,wheelRef.current.getBoundingClientRect());
    }
    function onMouseUp(){if(isDragging)endDrag();}
    if(isDragging){
      window.addEventListener('mousemove',onMouseMove);
      window.addEventListener('mouseup',onMouseUp);
    }
    return function(){window.removeEventListener('mousemove',onMouseMove);window.removeEventListener('mouseup',onMouseUp);};
  },[isDragging]);

  function polarToCart(cxv,cyv,rv,angleDeg){
    var rad=(angleDeg-90)*Math.PI/180;
    return{x:cxv+rv*Math.cos(rad),y:cyv+rv*Math.sin(rad)};
  }

  function slicePath(i){
    var startAngle=i*sliceAngle;
    var endAngle=(i+1)*sliceAngle;
    var os=polarToCart(cx,cy,outerR,startAngle);
    var oe=polarToCart(cx,cy,outerR,endAngle);
    var ie=polarToCart(cx,cy,innerR,endAngle);
    var is2=polarToCart(cx,cy,innerR,startAngle);
    return 'M '+os.x+' '+os.y+' A '+outerR+' '+outerR+' 0 0 1 '+oe.x+' '+oe.y+' L '+ie.x+' '+ie.y+' A '+innerR+' '+innerR+' 0 0 0 '+is2.x+' '+is2.y+' Z';
  }

  function labelPos(i){
    var midAngle=i*sliceAngle+sliceAngle/2;
    var labelR=(outerR+innerR)/2;
    return polarToCart(cx,cy,labelR,midAngle);
  }

  return <div className="relative wheel-glow" style={{width:size,height:size,margin:'0 auto',cursor:isDragging?'grabbing':'grab'}}
    ref={wheelRef} onTouchStart={handleTouchStart} onTouchMove={handleTouchMove} onTouchEnd={handleTouchEnd} onMouseDown={handleMouseDown}>
    <svg width={size} height={size} viewBox={'0 0 '+size+' '+size} style={{transform:'rotate('+rotation+'deg)'}}>

      {CARDS.map(function(c,i){
        var st=p.cardStates[c.id];
        var isDone=st==='completed';
        var isActive=st==='active';
        var fillColor=isDone?c.checkBg:c.color;
        var fillOpacity=isDone?0.6:isActive?0.95:0.8;
        var lp=labelPos(i);
        var isInProg=isActive||st==='planned';
        return <g key={c.id} onClick={function(){p.onOpen(c.id);}} style={{cursor:'pointer'}}>
          <path d={slicePath(i)} fill={fillColor} fillOpacity={fillOpacity} stroke="white" strokeWidth="3"/>
          {isDone&&<path d={slicePath(i)} fill="none" stroke="#4CAF50" strokeWidth="3" strokeOpacity="0.6"/>}
          {isInProg&&!isDone&&<path d={slicePath(i)} fill="none" stroke={c.checkBg} strokeWidth="2.5" strokeOpacity="0.6" strokeDasharray="6 4"/>}
          <g transform={'rotate('+(-(rotation))+' '+lp.x+' '+lp.y+')'}>
            <text x={lp.x} y={lp.y-12} textAnchor="middle" style={{fontSize:size*0.06+'px',pointerEvents:'none'}}>{c.emoji}</text>
            <text x={lp.x} y={lp.y+6} textAnchor="middle" fill="#614433" style={{fontSize:size*0.028+'px',fontWeight:600,fontFamily:'Inter,sans-serif',letterSpacing:'0.04em',pointerEvents:'none',opacity:0.7}}>{c.title.split(' ')[0]}</text>
            <text x={lp.x} y={lp.y+20} textAnchor="middle" fill="#614433" style={{fontSize:size*0.018+'px',fontWeight:400,fontFamily:'Inter,sans-serif',pointerEvents:'none',opacity:0.4}}>{c.wheelSub}</text>
            {isDone&&<text x={lp.x+size*0.055} y={lp.y-size*0.04} textAnchor="middle" style={{fontSize:'11px',pointerEvents:'none'}}>{'\u2714\uFE0F'}</text>}
          </g>
        </g>;
      })}
      {/* Center circle */}
      <circle cx={cx} cy={cy} r={innerR-2} fill="white" stroke="rgba(196,154,122,0.45)" strokeWidth="2"/>
      <circle cx={cx} cy={cy} r={innerR-6} fill="rgba(250,246,242,0.9)" stroke="none"/>
    </svg>

    {/* Pointer — fixed at top, outside the spinning wheel */}
    <div className="absolute" style={{left:size/2-10,top:-4,width:20,height:20,zIndex:10}}>
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
        <path d="M10 16L3 4h14L10 16z" fill="#C49A7A" stroke="white" strokeWidth="1.5"/>
      </svg>
    </div>

    {/* Center text - fixed (doesn't rotate) */}
    <div className="absolute flex flex-col items-center justify-center text-center rounded-full"
      style={{width:innerR*2-10,height:innerR*2-10,left:cx-(innerR-5),top:cy-(innerR-5),
        background:'rgba(255,255,255,0.85)',borderRadius:'50%',
        boxShadow:'0 2px 16px rgba(196,154,122,0.18), 0 1px 4px rgba(196,154,122,0.12)'}}>
      <p className="font-serif text-headline italic leading-snug" style={{fontSize:size*0.046+'px',fontWeight:500}}>Start your</p>
      <p className="font-serif text-headline italic leading-snug" style={{fontSize:size*0.046+'px',fontWeight:500}}>daily flow</p>
      <p className="font-sans leading-tight" style={{fontSize:size*0.029+'px',marginTop:size*0.015+'px',color:'#C49A7A',opacity:0.75}}>choose one</p>
      <p className="font-sans leading-tight" style={{fontSize:size*0.029+'px',color:'#C49A7A',opacity:0.75}}>to start</p>
    </div>
  </div>;
}

function MobileProgress(p){
  var _v=useState('day'),view=_v[0],setView=_v[1];
  var today=new Date();
  var dn=['M','T','W','T','F','S','S'];

  // Build history keyed by "Apr 17"-style date string (same format handleCompleteDay uses)
  var history=useMemo(function(){
    var h={};
    (p.logsData||[]).forEach(function(entry){
      if(!entry||!entry.date)return;
      var completed=[];
      CARDS.forEach(function(c){if(entry.activities&&entry.activities[c.id])completed.push(c.id);});
      h[entry.date]={completed:completed,activities:entry.activities||{}};
    });
    return h;
  },[p.logsData]);

  var isToday=function(d){return d&&d.toDateString()===today.toDateString();};
  var getWeek=function(){var days=[];var s=new Date(today);var dow=s.getDay();s.setDate(s.getDate()-(dow===0?6:dow-1));for(var i=0;i<7;i++){var d=new Date(s);d.setDate(d.getDate()+i);days.push(d);}return days;};
  var getMonth=function(){var y=today.getFullYear(),m=today.getMonth();var f=new Date(y,m,1),l=new Date(y,m+1,0);var pad=f.getDay()===0?6:f.getDay()-1;var days=[];for(var i=0;i<pad;i++)days.push(null);for(var d=1;d<=l.getDate();d++)days.push(new Date(y,m,d));return days;};

  var getData=function(d){
    var dateKey=d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
    if(isToday(d)){
      // If day was already closed today, show the closed log entry
      var histEntry=history[dateKey];
      var hasLiveState=Object.keys(p.cardStates||{}).length>0||Object.keys(p.selectedIdeas||{}).length>0;
      if(!hasLiveState&&histEntry)return histEntry;
      // Otherwise show live wheel state
      var acts={};CARDS.forEach(function(c){var ideas=p.selectedIdeas[c.id]||[];if(ideas.length>0)acts[c.id]=ideas[0];});
      return{completed:CARDS.filter(function(c){return p.cardStates[c.id]==='completed';}).map(function(c){return c.id;}),activities:acts};
    }
    return history[dateKey]||{completed:[],activities:{}};
  };

  var todayData=getData(today);

  return <div className="sc">
    <div className="flex items-center bg-cream rounded-full p-0.5 mb-4 w-fit">
      {['day','week','month'].map(function(v){return <button key={v} onClick={function(){setView(v);}} className={'font-sans text-[10px] px-4 py-1.5 rounded-full transition-all '+(view===v?'bg-white text-headline font-medium shadow-sm':'text-body opacity-50')}>{v}</button>;})}
    </div>

    {view==='day'&&<div>
      <p className="font-sans text-[11px] text-body opacity-40 mb-3">{today.toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'})}</p>
      <div className="space-y-2">{CARDS.map(function(c){var isCompleted=todayData.completed.indexOf(c.id)>=0;var act=todayData.activities[c.id]||(p.selectedIdeas[c.id]||[])[0];return <div key={c.id} className="flex items-start gap-2.5"><span className="text-[13px] mt-0.5">{c.emoji}</span><div className="flex-1"><p className="font-sans text-[9px] font-bold uppercase tracking-[0.1em] text-body opacity-40">{c.title}</p>{act?<p className="font-sans text-[12px] text-headline mt-0.5">{isCompleted?'\u2714 ':''}{act}</p>:<p className="font-sans text-[11px] text-body opacity-25 italic">not yet</p>}</div></div>;})}</div>
    </div>}

    {view==='week'&&function(){
      var wk=getWeek();
      return <div>
        <div className="grid grid-cols-7 gap-1 mb-1.5">{dn.map(function(n,i){return <div key={i} className="text-center font-sans text-[9px] text-body opacity-30 font-medium">{n}</div>;})}</div>
        <div className="grid grid-cols-7 gap-1">{wk.map(function(d){
          var k=d.toISOString().split('T')[0];var data=getData(d);var td=isToday(d);
          return <div key={k} className={'flex flex-col items-center gap-1 py-2 rounded-[12px] '+(td?'bg-accent/10 ring-1 ring-accent/20':'')}>
            <span className={'font-sans font-semibold text-[11px] '+(td?'text-accent':'text-body opacity-50')}>{d.getDate()}</span>
            <div className="flex flex-col gap-[3px] items-center w-full px-0.5">
              {data.completed.length>0?data.completed.map(function(catId){var c=CARDS.find(function(x){return x.id===catId;});return c?<div key={catId} className="rounded-full px-1.5 py-[1px] font-sans text-[7px] font-medium" style={{background:c.color,color:'#614433',border:'1px solid '+c.borderColor}}>{c.title.split(' ')[0]}</div>:null;})
              :<div className="font-sans text-[8px] text-body opacity-15">--</div>}
            </div>
          </div>;
        })}</div>
      </div>;
    }()}

    {view==='month'&&function(){
      var md=getMonth();var mn=today.toLocaleDateString('en-US',{month:'long',year:'numeric'});
      return <div>
        <p className="font-sans text-[11px] text-body opacity-40 mb-2">{mn}</p>
        <div className="grid grid-cols-7 gap-[3px] mb-1">{dn.map(function(n,i){return <div key={i} className="text-center font-sans text-[8px] text-body opacity-25 font-medium">{n}</div>;})}</div>
        <div className="grid grid-cols-7 gap-[3px]">{md.map(function(d,idx){
          if(!d)return <div key={'p'+idx}/>;
          var k=d.toISOString().split('T')[0];var data=getData(d);var td=isToday(d);
          return <div key={k} className={'flex flex-col items-center gap-[2px] py-1 rounded-[8px] min-h-[32px] '+(td?'bg-accent/10 ring-1 ring-accent/20':'')}>
            <span className={'font-sans font-medium text-[9px] '+(td?'text-accent':'text-body opacity-40')}>{d.getDate()}</span>
            <div className="flex flex-wrap justify-center gap-[2px]">{data.completed.map(function(catId){var c=CARDS.find(function(x){return x.id===catId;});return c?<div key={catId} className="rounded-full px-1 py-[0px] font-sans text-[6px] font-medium" style={{background:c.color,color:'#614433',border:'1px solid '+c.borderColor}}>{c.emoji}</div>:null;})}</div>
          </div>;
        })}</div>
        {/* Color legend */}
        <div className="flex flex-wrap gap-x-3 gap-y-1.5 mt-3 pt-3 border-t border-black/[0.04]">
          {CARDS.map(function(c){return <div key={c.id} className="flex items-center gap-1.5">
            <div className="w-[8px] h-[8px] rounded-full" style={{background:c.checkBg}}/>
            <span className="text-[10px]">{c.emoji}</span>
            <span className="font-sans text-[8px] text-body opacity-40">{c.title.split(' ')[0]}</span>
          </div>;})}
        </div>
      </div>;
    }()}
  </div>;
}

    var lines=['Passion Flow Daily — My Journal','Exported on '+new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'}),'','━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━',''];

                      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="#614433" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M2 8a6 6 0 1 0 1.5-4L2 2v4h4"/></svg>
                    </button>

            style={{background:'#C49A7A',boxShadow:'0 4px 14px rgba(196,154,122,0.3)'}}>
            Close the day.
          </button>

          <div className="mb-4">
            <p className="font-sans text-[12px] text-headline font-medium mb-2">did today feel balanced?</p>
            <div className="flex gap-2">
              {[{v:'not-quite',l:'not quite',e:'\uD83D\uDE15'},{v:'getting-there',l:'getting there',e:'\uD83D\uDE0C'},{v:'yes',l:'yes, it did',e:'\u2728'}].map(function(o){
                var sel=satisfaction===o.v;

                  <span className="text-[16px]">{o.e}</span><span className={'font-sans text-[9px] font-medium '+(sel?'text-accent':'text-body opacity-50')}>{o.l}</span>
                </button>;

            className="textarea-journal w-full bg-cream rounded-[14px] border border-transparent font-sans text-[12px] text-body px-3 py-2 resize-none mb-2"/>

                  if(speechRef.current){speechRef.current.stop();speechRef.current=null;}
                  setIsRecording(false);

                  var r=new SR();
                  r.continuous=true;
                  r.interimResults=false;
                  r.lang='en-US';

                    var t=Array.from(e.results).slice(e.resultIndex).map(function(res){return res[0].transcript;}).join(' ');

              <div className="flex-1">

                <div className="flex justify-center mb-5">
                  <div style={{width:560,height:560}}>
                    <FlowWheel size={560} cardStates={cardStates} onOpen={function(id){setOpenCard(id);}}/>
                  </div>
                </div>

                {/* Progress steps */}
                <div className="flex items-center justify-center gap-2 mb-3 px-4">
                  {CARDS.map(function(c,i){
                    var done=cardStates[c.id]==='completed';var active=cardStates[c.id]==='active'||cardStates[c.id]==='planned';var isLast=i===CARDS.length-1;
                    return <div key={c.id} className="flex items-center" style={{flex:isLast?'0 0 auto':'1'}}>
                      <div className="flex flex-col items-center gap-1">
                        <div className="w-[40px] h-[40px] rounded-full flex items-center justify-center border-2 transition-all duration-500" style={{background:done?c.checkBg:c.color,borderColor:done?'#4CAF50':active?c.checkBg:c.borderColor,boxShadow:done?'0 0 12px '+c.checkBg+'50':'none'}}>
                          {done?<svg width="16" height="16" viewBox="0 0 14 14" fill="none"><path d="M3 7.5L6 10.5L11 4" stroke="white" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>:<span className="text-[16px]">{c.emoji}</span>}
                        </div>
                        <span className={'font-sans text-[9px] font-medium '+(done?'text-headline':'text-body opacity-45')}>{c.title.split(' ')[0]}</span>
                      </div>
                      {!isLast&&<div className="flex-1 h-[2px] mx-2 rounded-full transition-all duration-700 -mt-4" style={{background:done?c.checkBg:'rgba(196,154,122,0.15)'}}/>}
                    </div>;
                  })}
                </div>
                <p className="font-sans text-[12px] text-body opacity-40 text-center mb-5">{completedCount}/5 completed</p>

                {/* To Do + Completed inline */}
                <div className="flex gap-4 mb-5">
                  {(function(){
                    var inProgress=CARDS.filter(function(c){var st=cardStates[c.id];return st==='planned'||st==='active';});
                    var completed=CARDS.filter(function(c){return cardStates[c.id]==='completed';});
                    return <React.Fragment>
                      <div className="flex-1 rounded-[18px] px-4 py-3.5" style={{background:'white',border:'1px solid #C49A7A',boxShadow:'0 0 14px rgba(196,154,122,0.1)'}}>
                        <p className="font-sans text-[10px] font-semibold text-body opacity-30 uppercase tracking-[0.12em] mb-2">To Do</p>
                        {inProgress.length>0?<div className="space-y-2">{inProgress.map(function(c){var ideas=selectedIdeas[c.id]||[];return <div key={c.id} className="flex items-center rounded-[12px] border overflow-hidden transition-all" style={{background:c.color+'30',borderColor:c.borderColor}}>
                          <button onClick={function(){completeCat(c.id);}} className="flex-1 flex items-center gap-2.5 px-3 py-2.5 text-left active:scale-[0.97] transition-all">
                            <span className="text-[16px]">{c.emoji}</span><div className="flex-1 min-w-0"><p className="font-sans text-[11px] text-headline font-semibold">{c.title.split(' ')[0]}</p><p className="font-sans text-[9px] text-body opacity-45 truncate">{ideas.join(', ')}</p></div>
                            <span className="font-sans text-[9px] text-accent font-medium opacity-60 whitespace-nowrap">tap to complete</span>
                          </button>
                          <button onClick={function(){setCardStates(function(prev){var n=Object.assign({},prev);delete n[c.id];return n;});setSelectedIdeas(function(prev){var n=Object.assign({},prev);delete n[c.id];return n;});}} className="flex-shrink-0 w-[34px] flex items-center justify-center self-stretch hover:opacity-70 transition-opacity" style={{borderLeft:'1px solid rgba(196,154,122,0.2)',background:'rgba(255,80,80,0.05)'}}>
                            <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="#E57373" strokeWidth="1.8" strokeLinecap="round"><path d="M2 4h12"/><path d="M6.67 7.33v4"/><path d="M9.33 7.33v4"/><path d="M3.33 4l.67 9.33a1.33 1.33 0 001.33 1.34h5.34a1.33 1.33 0 001.33-1.34L12.67 4"/></svg>
                          </button>
                        </div>;})}</div>:<p className="font-sans text-[10px] text-body opacity-20 italic">click the wheel to add</p>}
                      </div>
                      <div className="flex-1 rounded-[18px] px-4 py-3.5" style={{background:'white',border:'1px solid #C49A7A',boxShadow:'0 0 14px rgba(196,154,122,0.1)'}}>
                        <p className="font-sans text-[10px] font-semibold text-body opacity-30 uppercase tracking-[0.12em] mb-2">Completed</p>
                        {completed.length>0?<div className="space-y-2">{completed.map(function(c){var ideas=selectedIdeas[c.id]||[];return <div key={c.id} className="flex items-center rounded-[12px] overflow-hidden fade-in" style={{background:c.color,opacity:0.85}}>
                          <div className="flex-1 flex items-center gap-2.5 px-3 py-2.5">
                            <span className="text-[16px]">{c.emoji}</span><div className="flex-1 min-w-0"><p className="font-sans text-[11px] text-headline font-semibold">{c.title.split(' ')[0]}</p><p className="font-sans text-[9px] text-body opacity-40 truncate line-through">{ideas.join(', ')}</p></div>
                            <span className="check-pop text-[12px]" style={{color:'#4CAF50'}}>{'\u2714'}</span>
                          </div>
                          <button onClick={function(){setCardStates(function(prev){var n=Object.assign({},prev);n[c.id]='planned';return n;});}} className="flex-shrink-0 w-[34px] flex items-center justify-center self-stretch hover:opacity-70 transition-opacity" style={{borderLeft:'1px solid rgba(196,154,122,0.2)',background:'rgba(255,255,255,0.3)'}}>
                            <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="#614433" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M2 8a6 6 0 1 0 1.5-4L2 2v4h4"/></svg>
                          </button>
                        </div>;})}</div>:<p className="font-sans text-[10px] text-body opacity-20 italic">{'\u2014'}</p>}
                      </div>
                    </React.Fragment>;
                  })()}
                </div>

                {/* Complete button */}
                <div className="text-center">
                  <button onClick={function(){setPendingCloseType('basic');setShowCloseConfirm(true);}} className="font-sans text-[14px] font-semibold text-white px-10 py-3.5 rounded-full transition-all hover:scale-[1.02]"
                    style={{background:'#C49A7A',boxShadow:'0 4px 14px rgba(196,154,122,0.3)'}} onMouseEnter={function(e){e.target.style.background='#2E1C16';}} onMouseLeave={function(e){e.target.style.background='#C49A7A';}}>
                    Close the day.
                  </button>
                </div>
              </div>

              {/* RIGHT: Sessions first, then Reflection below */}
              <div className="w-[340px] flex-shrink-0 space-y-5">
                {/* Sessions */}
                <div>
                  <h2 className="font-serif text-[20px] text-headline italic mb-3">Your Sessions.</h2>
                  <div className="sc">
                    <div className="space-y-3">{CARDS.map(function(c){return <div key={c.id}><div className="flex items-center justify-between mb-1"><div className="flex items-center gap-2"><span className="text-[14px]">{c.emoji}</span><span className="font-sans text-[10px] font-medium text-headline">{c.title}</span></div><span className="font-sans text-[11px] font-semibold text-headline">{sessions[c.id]}</span></div><SessionBar total={sessions[c.id]} maxTotal={maxSessions} darkColor={c.checkBg} borderColor={c.borderColor}/></div>;})}</div>
                  </div>
                </div>

                {/* Reflection */}
                <div>
                  <h2 className="font-serif text-[20px] text-headline italic mb-3">how did today feel? <span className="font-sans text-[10px] font-normal text-body opacity-35">(optional)</span></h2>
                  <div className="sc">
                    <div className="mb-4"><p className="font-sans text-[12px] text-headline font-medium mb-2">did today feel balanced?</p>
                    <div className="flex gap-2">{[{v:'not-quite',l:'not quite',e:'\uD83D\uDE15'},{v:'getting-there',l:'getting there',e:'\uD83D\uDE0C'},{v:'yes',l:'yes, it did',e:'\u2728'}].map(function(o){var sel=satisfaction===o.v;return <button key={o.v} onClick={function(){setSatisfaction(sel?null:o.v);}} className="flex-1 flex flex-col items-center gap-1 py-2 rounded-[12px] border transition-all active:scale-[0.97]" style={{background:sel?'rgba(196,154,122,0.12)':'#FAF6F2',borderColor:sel?'#C49A7A':'rgba(0,0,0,0.04)'}}><span className="text-[16px]">{o.e}</span><span className={'font-sans text-[9px] font-medium '+(sel?'text-accent':'text-body opacity-50')}>{o.l}</span></button>;})}</div></div>
                    <div className="w-10 h-px bg-black/[0.06] mx-auto mb-4"/>
                    <FlowSlider value={flowScore} onChange={setFlowScore}/>
                    <div className="w-10 h-px bg-black/[0.06] mx-auto my-4"/>
                    <p className="font-sans text-[11px] text-body opacity-45 mb-2">how are you feeling?</p>
                    <div className="flex flex-wrap gap-1.5 mb-4">{FEELINGS.map(function(f){var sel=selectedFeelings.indexOf(f.label)>=0;return <button key={f.label} onClick={function(){toggleFeeling(f.label);}} className={'feeling-chip font-sans text-[10px] px-2 py-1.5 rounded-full border transition-all flex items-center gap-1 '+(sel?'bg-accent text-white border-accent':'bg-cream text-body border-black/[0.06] hover:border-accent/30')}><span className="text-[11px]">{f.emoji}</span>{f.label}</button>;})}</div>
                    <label className="font-sans text-[10px] text-body opacity-45 block mb-1">one moment you don't want to forget</label>
                    <textarea value={reflection} onChange={function(e){setReflection(e.target.value);setReflectionSaved(false);}} rows={3} placeholder="today I felt..." className="textarea-journal w-full bg-cream rounded-[14px] border border-transparent font-sans text-[12px] text-body px-3 py-2 resize-none mb-2"/>
                    <button onClick={function(){
                      var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
                      if(!SR){alert('Voice memo isn\'t supported in this browser. Try Chrome or Safari.');return;}
                      if(isRecording){
                        if(speechRef.current){speechRef.current.stop();speechRef.current=null;}
                        setIsRecording(false);
                      } else {
                        var r=new SR();
                        r.continuous=true;r.interimResults=false;r.lang='en-US';
                        r.onresult=function(e){
                          var t=Array.from(e.results).slice(e.resultIndex).map(function(res){return res[0].transcript;}).join(' ');
                          setReflection(function(prev){return prev?prev+' '+t:t;});
                          setReflectionSaved(false);
                          setHasVoiceMemo(true);
                        };
                        r.onerror=function(e){console.error('speech error',e);setIsRecording(false);};
                        r.onend=function(){setIsRecording(false);};
                        speechRef.current=r;r.start();setIsRecording(true);
                      }
                    }} className="flex items-center gap-1.5 px-3 py-1.5 rounded-full border transition-all active:scale-[0.97]"
                      style={{background:isRecording?'#FCE4EC':'#FAF6F2',borderColor:isRecording?'#E890A8':'rgba(0,0,0,0.06)'}}>
                      {isRecording?<span className="w-[8px] h-[8px] rounded-full bg-red-400 almost-there"/>:<svg width="12" height="12" viewBox="0 0 14 14" fill="none" stroke="#C49A7A" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M7 1v8M7 9a3 3 0 003-3V4a3 3 0 00-6 0v2a3 3 0 003 3zM4 13h6M7 9v4"/></svg>}
                      <span className={'font-sans text-[10px] font-medium '+(isRecording?'text-red-400':'text-body opacity-50')}>{isRecording?'tap to stop':'\uD83C\uDF99 voice memo'}</span>
                    </button>
                  </div>
                  <button onClick={function(){if(reflectionSaved)return;setPendingCloseType('reflection');setShowCloseConfirm(true);}} className="w-full font-sans text-[13px] font-semibold py-3 rounded-full transition-all mt-4"
                    style={{background:reflectionSaved?'#E8F5E9':'#C49A7A',color:reflectionSaved?'#4CAF50':'white',boxShadow:reflectionSaved?'none':'0 4px 14px rgba(196,154,122,0.3)'}} onMouseEnter={function(e){if(!reflectionSaved)e.target.style.background='#2E1C16';}} onMouseLeave={function(e){if(!reflectionSaved)e.target.style.background='#C49A7A';}}>
                    {reflectionSaved?'\u2714 day closed':'Save reflection & close the day.'}
                  </button>
                </div>
              </div>
            </div>
          </div>}

          {/* JOURNAL TAB */}
          {desktopTab==='journal'&&<div className="max-w-[700px]">
            <h2 className="font-serif text-[22px] text-headline italic mb-5">Your Days.</h2>
            <div className="space-y-5">{logsData.map(function(log,i){return <div key={i} className="sc">
              <div className="flex items-center justify-between mb-3"><p className="font-serif text-[16px] text-headline italic">{log.date}</p>
                <button onClick={function(){setShareLog(log);}} className="flex items-center gap-1.5 font-sans text-[10px] text-accent opacity-60 hover:opacity-100 transition-opacity">share this day <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M4 8l4-4 4 4"/><path d="M8 4v8"/><path d="M3 14h10"/></svg></button>
              </div>
              <div className="grid grid-cols-2 gap-3 mb-3">{CARDS.map(function(c){var act=log.activities[c.id];if(!act)return null;return <div key={c.id} className="flex items-start gap-2 px-3 py-2 rounded-[12px]" style={{background:c.color,border:'1px solid '+c.borderColor}}>
                <span className="text-[14px] mt-0.5">{c.emoji}</span><div><p className="font-sans text-[9px] font-bold uppercase tracking-[0.08em] text-body opacity-40">{c.title}</p><p className="font-sans text-[12px] text-headline">{act}</p></div>
              </div>;})}</div>
              <div className="flex items-center gap-4 flex-wrap">
                {log.flow!=null&&<p className="font-sans text-[10px] text-body opacity-45">flow: {log.flow}/10</p>}
                {log.balance&&<p className="font-sans text-[10px] text-accent opacity-55">{log.balance==='yes'?'\u2728 balanced':log.balance==='getting-there'?'\uD83D\uDE0C getting there':'\uD83D\uDE15 not quite'}</p>}
                {log.feelings&&log.feelings.length>0&&log.feelings.map(function(f){var fe=FEELINGS.find(function(x){return x.label===f;});return <span key={f} className="font-sans text-[9px] text-accent bg-accent/10 px-2 py-0.5 rounded-full">{fe?fe.emoji:''} {f}</span>;})}
              </div>
              {log.reflection&&<p className="font-serif text-[12px] text-body italic opacity-50 mt-2">"{log.reflection}"</p>}
            </div>;})}</div>
          </div>}

          {/* MOMENTS TAB */}
          {desktopTab==='moments'&&<div className="max-w-[700px]">
            <div className="grid grid-cols-2 gap-8">
              <div>
                <h2 className="font-serif text-[22px] text-headline italic mb-4">Saved Ideas.</h2>
                <div className="sc"><p className="font-sans text-[11px] text-body opacity-40 mb-3 italic">the moments you didn't want to forget</p>
                  {allSavedMoments.length>0?<div className="space-y-2.5">{allSavedMoments.slice(0,8).map(function(m,i){var c=CARDS.find(function(x){return x.id===m.category;});return <div key={m.text+i} className="rounded-[14px] px-3.5 py-2.5 border" style={{background:c?c.color:'#FAF6F2',borderColor:c?c.borderColor:'rgba(0,0,0,0.06)'}}><div className="flex items-start justify-between gap-2"><p className="font-sans text-[9px] font-bold uppercase tracking-[0.1em] text-body opacity-40 mb-0.5">{c?c.title:'Activity'}</p><button onClick={function(){toggleSave(m.category,m.text);}} className="flex-shrink-0 flex items-center justify-center w-[22px] h-[22px] rounded-full transition-all hover:bg-black/20" style={{color:'#614433',background:'rgba(97,68,51,0.1)'}}><svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"><path d="M2 4h12"/><path d="M6.67 7.33v4"/><path d="M9.33 7.33v4"/><path d="M3.33 4l.67 9.33a1.33 1.33 0 001.33 1.34h5.34a1.33 1.33 0 001.33-1.34L12.67 4"/></svg></button></div><p className="font-sans text-[13px] text-headline">{'\uD83D\uDD16'} {m.text}</p><span className="font-sans text-[9px] text-body opacity-25">{m.date}</span></div>;})}</div>:<p className="font-sans text-[12px] text-body opacity-30 italic text-center py-4">bookmark an activity to save it here</p>}
                </div>
              </div>
              <div>
                <h2 className="font-serif text-[22px] text-headline italic mb-4">Recent.</h2>
                <div className="sc"><p className="font-sans text-[11px] text-body opacity-40 mb-3 italic">what you've been doing lately</p>
                  <div className="space-y-2">{recentHistory.map(function(r,i){var c=CARDS.find(function(x){return x.id===r.category;});return <div key={i} className="flex items-center gap-2.5 py-1.5 border-b border-black/[0.03] last:border-0"><span className="text-[13px]">{c?c.emoji:''}</span><div className="flex-1 min-w-0"><p className="font-sans text-[12px] text-headline truncate">{r.text}</p><p className="font-sans text-[9px] text-body opacity-35">{c?c.title:''}</p></div><span className="font-sans text-[9px] text-body opacity-25">{r.date}</span></div>;})}</div>
                </div>
              </div>
            </div>
          </div>}

          {/* STATS TAB */}
          {desktopTab==='stats'&&<div className="max-w-[700px]">
            <div className="flex items-center gap-4 mb-6">
              <div className="flex items-center gap-2 px-4 py-2.5 rounded-full" style={{background:'white',border:'1px solid #C49A7A'}}><span className="text-[18px]">{'\uD83D\uDD25'}</span><div><p className="font-sans text-[18px] font-bold text-headline leading-none">{streak}</p><p className="font-sans text-[9px] text-body opacity-40">day streak</p></div></div>
              <div className="flex items-center gap-2 px-4 py-2.5 rounded-full" style={{background:'white',border:'1px solid #C49A7A'}}><span className="text-[18px]">{'\u2714\uFE0F'}</span><div><p className="font-sans text-[18px] font-bold text-headline leading-none">{Object.values(sessions).reduce(function(a,b){return a+b;},0)}</p><p className="font-sans text-[9px] text-body opacity-40">total sessions</p></div></div>
            </div>
            <div className="grid grid-cols-2 gap-8">
              <div>
                <h2 className="font-serif text-[22px] text-headline italic mb-4">Your Sessions.</h2>
                <div className="sc"><div className="space-y-3">{CARDS.map(function(c){return <div key={c.id}><div className="flex items-center justify-between mb-1.5"><div className="flex items-center gap-2"><span className="text-[15px]">{c.emoji}</span><span className="font-sans text-[11px] font-medium text-headline">{c.title}</span></div><span className="font-sans text-[12px] font-semibold text-headline">{sessions[c.id]}</span></div><SessionBar total={sessions[c.id]} maxTotal={maxSessions} darkColor={c.checkBg} borderColor={c.borderColor}/></div>;})}</div></div>
              </div>
              <div>
                <h2 className="font-serif text-[22px] text-headline italic mb-4">Your Progress.</h2>
                <MobileProgress cardStates={cardStates} selectedIdeas={selectedIdeas} logsData={logsData}/>
              </div>
            </div>
          </div>}

          {/* SETTINGS TAB */}
          {desktopTab==='settings'&&<div className="max-w-[600px]">
            <h2 className="font-serif text-[22px] text-headline italic mb-5">Settings.</h2>
            <div className="grid grid-cols-2 gap-6">
              {/* Left column */}
              <div className="space-y-5">
                {/* Profile */}
                <div className="sc">
                  <p className="font-sans text-[10px] font-semibold text-body opacity-30 uppercase tracking-[0.12em] mb-3">Profile</p>
                  <div className="flex items-center gap-3 mb-4">
                    <div className="w-[56px] h-[56px] rounded-full flex items-center justify-center" style={{background:'#FCE4EC',border:'2px solid #F0B8C8'}}>
                      <span className="font-serif text-[22px] text-headline font-semibold">{userName.charAt(0)}</span>
                    </div>
                    <div className="flex-1">
                      <label className="font-sans text-[10px] text-body opacity-45 block mb-1">your name</label>
                      <input type="text" value={userName} onChange={function(e){setUserName(e.target.value);}} className="w-full bg-cream rounded-[10px] border border-transparent font-sans text-[14px] text-headline px-3 py-2"/>
                    </div>
                  </div>
                  <div>
                    <label className="font-sans text-[10px] text-body opacity-45 block mb-1">email</label>
                    <p className="font-sans text-[13px] text-body opacity-50 px-3 py-2 bg-cream rounded-[10px]">{currentUser?currentUser.email:'—'}</p>
                  </div>
                </div>

                {/* Preferences */}
                <div className="sc">
                  <p className="font-sans text-[10px] font-semibold text-body opacity-30 uppercase tracking-[0.12em] mb-3">Preferences</p>
                  <div className="mb-3">
                    <div className="flex items-center gap-2 mb-1">
                      <label className="font-sans text-[10px] text-body opacity-45">daily reminder</label>
                      <span className="font-sans text-[8px] font-semibold uppercase tracking-[0.08em] px-1.5 py-0.5 rounded-full" style={{background:'rgba(196,154,122,0.15)',color:'#C49A7A'}}>coming soon</span>
                    </div>
                    <div className="flex items-center gap-2 opacity-40 pointer-events-none">
                      <input type="text" value={reminderTime} readOnly className="bg-cream rounded-[10px] border border-transparent font-sans text-[13px] text-headline px-3 py-2 w-[130px]"/>
                      <span className="font-sans text-[11px] text-body opacity-40">every morning</span>
                    </div>
                  </div>
                  <div>
                    <label className="font-sans text-[10px] text-body opacity-45 block mb-1">quote style</label>
                    <p className="font-sans text-[13px] text-body opacity-50 px-3 py-2 bg-cream rounded-[10px]">{'\u2728'} inspirational (default)</p>
                  </div>
                </div>
              </div>

              {/* Right column */}
              <div className="space-y-5">
                {/* Data */}
                <div className="sc">
                  <p className="font-sans text-[10px] font-semibold text-body opacity-30 uppercase tracking-[0.12em] mb-3">Data</p>
                  <button onClick={handleExportJournal} className="w-full flex items-center justify-between px-3 py-2.5 rounded-[10px] bg-cream mb-2 transition-all hover:bg-accent/5 active:scale-[0.98]">
                    <span className="font-sans text-[13px] text-headline">Export my journal</span>
                    <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#C49A7A" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M8 2v8M5 7l3 3 3-3"/><path d="M3 12h10"/></svg>
                  </button>

          <svg width="16" height="16" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2c-2 1.5-4.5 2.4-7.2 2.4-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.6l6.2 5.2C40.9 35.6 44 30.3 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>
          continue with google
        </button>

        <div className="flex items-center gap-3 mb-5">
          <div className="flex-1 h-px bg-black/10"></div>
          <span className="font-sans text-[11px] text-body opacity-50 uppercase tracking-wider">or</span>
          <div className="flex-1 h-px bg-black/10"></div>
        </div>

        {authMode==='signup'&&<input type="text" placeholder="your name" value={authName} onChange={function(e){setAuthName(e.target.value);setAuthError('');}} className="w-full font-sans text-[15px] px-4 py-3.5 mb-3 rounded-2xl bg-white/60 focus:outline-none" style={{border:'1px solid rgba(196,154,122,0.5)'}}/>}
        <input type="email" placeholder="email" value={authEmail} onChange={function(e){setAuthEmail(e.target.value);setAuthError('');}} className="w-full font-sans text-[15px] px-4 py-3.5 mb-3 rounded-2xl bg-white/60 focus:outline-none" style={{border:'1px solid rgba(196,154,122,0.5)'}}/>
        <input type="password" placeholder="password" value={authPass} onChange={function(e){setAuthPass(e.target.value);setAuthError('');}} className="w-full font-sans text-[15px] px-4 py-3.5 mb-3 rounded-2xl bg-white/60 focus:outline-none" style={{border:'1px solid rgba(196,154,122,0.5)'}}/>

        {authError&&<p className="font-sans text-[13px] text-center mb-3" style={{color:'#B34B3D'}}>{authError}</p>}

        <button onClick={function(){if(authMode==='signup'&&!authName.trim()){setAuthError('please enter your name');return;}if(!authEmail||!authPass){setAuthError('please fill in both fields');return;}if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(authEmail)){setAuthError('that email looks off');return;}if(authPass.length<6){setAuthError('password must be at least 6 characters');return;}var handleErr=function(e){var m=e.message||'something went wrong';if(e.code==='auth/email-already-in-use')m='that email is already registered — try logging in';else if(e.code==='auth/wrong-password'||e.code==='auth/invalid-credential')m='wrong password';else if(e.code==='auth/user-not-found')m='no account found — try signing up';else if(e.code==='auth/weak-password')m='password must be at least 6 characters';setAuthError(m);};if(authMode==='signup'){var nm=authName.trim();firebase.auth().createUserWithEmailAndPassword(authEmail,authPass).then(function(cred){return cred.user.updateProfile({displayName:nm});}).then(function(){setUserName(nm);setShowAuth(false);}).catch(handleErr);}else{firebase.auth().signInWithEmailAndPassword(authEmail,authPass).then(function(){setShowAuth(false);}).catch(handleErr);}}} className="w-full font-sans text-[15px] font-bold text-white py-4 rounded-full active:scale-[0.98] mt-2" style={{background:'#C49A7A',boxShadow:'0 4px 14px rgba(196,154,122,0.3)'}}>
          {authMode==='signup'?'sign up':'log in'}
        </button>

        <button onClick={function(){setAuthMode(authMode==='signup'?'login':'signup');setAuthError('');}} className="w-full font-sans text-[13px] text-body opacity-60 mt-5 hover:opacity-100">
          {authMode==='signup'?'already have an account? log in':'new here? sign up'}
        </button>

        <p className="font-sans text-[11px] text-body text-center opacity-60 mt-8 leading-relaxed">
          by continuing, you agree to our{' '}
          <button onClick={function(){setShowTerms(true);}} className="underline hover:opacity-100">terms</button>
          {' '}and{' '}
          <button onClick={function(){setShowPrivacy(true);}} className="underline hover:opacity-100">privacy policy</button>
        </p>
      </div>
    </div>}
    {!showOnboard&&!showPaywall&&!showAuth&&renderMobile()}
    {!showOnboard&&!showPaywall&&!showAuth&&renderDesktop()}

    {/* Shared card panel overlay (works on both mobile + desktop) */}
    {openCard&&<MobileCardPanel
      card={CARDS.find(function(c){return c.id===openCard;})}
      state={cardStates[openCard]||'default'}
      selectedIdeas={selectedIdeas[openCard]||[]}
      savedIdeas={savedIdeas[openCard]||[]}
      customIdeas={customIdeas[openCard]||[]}
      deletedIdeas={deletedIdeas[openCard]||[]}
      onSelectSingle={selectSingle} onToggleSave={toggleSave}
      onRequestDelete={function(cid,idea){confirmDelete(cid,idea);}}
      onStartThis={startThis} onComplete={completeCat} onAddCustom={addCustom}
      onClose={function(){setOpenCard(null);}}
    />}

    {/* Shared completion overlay */}
    {showOverlay&&<div className="fixed inset-0 z-50 flex items-center justify-center" style={{background:'rgba(250,246,242,0.92)',backdropFilter:'blur(8px)'}}>
      <div className={overlayFading?'overlay-out':'overlay-in'} style={{textAlign:'center',maxWidth:'320px',padding:'0 20px'}}>
        {[0,1,2,3,4,5,6,7].map(function(i){return <span key={i} className="absolute" style={{left:(12+i*11)+'%',top:'28%',fontSize:'14px',animation:'confetti 1.5s ease forwards',animationDelay:(i*0.1)+'s',opacity:0}}>{['\u2728','\u2764','\uD83C\uDF3F','\u2B50','\uD83D\uDC9B','\uD83C\uDFA8','\uD83D\uDE80','\u2615'][i]}</span>;})}
        <p className="text-[36px] mb-3">{'\u2728'}</p>
        <h2 className="font-serif text-[28px] text-headline italic mb-2">Day Complete.</h2>
        <p className="font-sans text-[14px] text-body opacity-55 italic mb-5">{AFFIRMATIONS[Math.floor(Math.random()*AFFIRMATIONS.length)]}</p>
        <div className="w-[200px] h-[24px] rounded-full border overflow-hidden flex items-center px-[4px] gap-[3px] mx-auto mb-3" style={{background:'#FAF6F2',borderColor:'#C49A7A'}}>
          {CARDS.map(function(c){var done=cardStates[c.id]==='completed';return <div key={c.id} className="flex-1 h-[16px] rounded-[4px] transition-all duration-700" style={{background:done?c.checkBg:c.color,opacity:done?1:0.15}}/>;})}</div>
        <p className="font-sans text-[13px] text-headline font-semibold mb-4">{completedCount}/5 completed</p>
        <div className="flex items-center justify-center gap-4 mb-4">
          <div className="flex items-center gap-2 px-3.5 py-2 rounded-full" style={{background:'white',border:'1px solid #C49A7A'}}><span className="text-[16px]">{'\uD83D\uDD25'}</span><div className="text-left"><p className="font-sans text-[16px] font-bold text-headline leading-none">{streak}</p><p className="font-sans text-[8px] text-body opacity-40">day streak</p></div></div>
          <div className="flex items-center gap-2 px-3.5 py-2 rounded-full" style={{background:'white',border:'1px solid #C49A7A'}}><span className="text-[16px]">{'\u2714\uFE0F'}</span><div className="text-left"><p className="font-sans text-[16px] font-bold text-headline leading-none">{Object.values(sessions).reduce(function(a,b){return a+b;},0)}</p><p className="font-sans text-[8px] text-body opacity-40">total sessions</p></div></div>
        </div>
        {overlayType==='reflection'&&<div>
          {satisfaction&&<p className="font-sans text-[12px] text-accent opacity-60 mb-2">{satisfaction==='yes'?'\u2728 balanced':satisfaction==='getting-there'?'\uD83D\uDE0C getting there':'\uD83D\uDE15 not quite'}</p>}
          <p className="font-sans text-[11px] text-body opacity-40 mb-2">flow: {flowScore}/10 {flowScore<=3?'\uD83D\uDCA8':flowScore<=7?'\uD83C\uDFAF':'\uD83D\uDE80'}</p>
          {selectedFeelings.length>0&&<div className="flex flex-wrap justify-center gap-1.5 mb-2">{selectedFeelings.map(function(f){var fe=FEELINGS.find(function(x){return x.label===f;});return <span key={f} className="font-sans text-[10px] text-accent bg-accent/10 px-2.5 py-0.5 rounded-full">{fe?fe.emoji:''} {f}</span>;})}</div>}
          {reflection&&<p className="font-serif text-[12px] text-body italic opacity-50">"{reflection}"</p>}
        </div>}
      </div>
    </div>}

    {/* Shared saved confirmation */}
    {showSavedMsg&&<div className="fixed bottom-24 left-0 right-0 z-50 flex flex-col items-center gap-2 fade-in">
      <div className="font-sans text-[12px] text-green-600 bg-green-50 border border-green-200 px-4 py-2 rounded-full shadow-sm">{'\u2714'} saved to your days</div>
      <button onClick={function(){setShowSavedMsg(false);setMobileTab('logs');setDesktopTab('journal');}} className="font-sans text-[11px] text-accent font-medium opacity-70 hover:opacity-100 transition-opacity flex items-center gap-1">view in your days <span className="text-[10px]">{'\u2192'}</span></button>
    </div>}

    {/* Shared share overlay */}
    {shareLog&&<div className="fixed inset-0 z-50 flex items-center justify-center" style={{background:'rgba(0,0,0,0.4)'}} onClick={function(e){if(e.target===e.currentTarget)setShareLog(null);}}>
      <div className="w-[320px] rounded-[24px] overflow-hidden fade-in" style={{boxShadow:'0 8px 40px rgba(0,0,0,0.15)'}}>
        <div className="px-6 py-6" style={{background:'linear-gradient(160deg, #FCE4EC 0%, #FAF6F2 40%, #EDE6F6 70%, #E0F2E9 100%)'}}>
          <p className="font-sans text-[9px] text-body opacity-40 uppercase tracking-[0.15em] mb-2">Passion Flow Daily</p>
          <p className="font-serif text-[20px] text-headline italic leading-snug mb-4">{shareLog.date}</p>
          <div className="space-y-2.5 mb-4">{CARDS.map(function(c){var act=shareLog.activities[c.id];if(!act)return null;return <div key={c.id} className="flex items-start gap-2.5 px-3 py-2 rounded-[12px]" style={{background:'rgba(255,255,255,0.6)',border:'1px solid '+c.borderColor}}><span className="text-[15px] mt-0.5">{c.emoji}</span><div className="flex-1"><p className="font-sans text-[9px] font-bold uppercase tracking-[0.08em] text-body opacity-40">{c.title}</p><p className="font-sans text-[12px] text-headline leading-snug">{act}</p></div></div>;})}</div>
          <div className="flex items-center gap-3 mb-3"><p className="font-sans text-[11px] text-body opacity-50">flow: {shareLog.flow}/10</p>{shareLog.balance&&<p className="font-sans text-[11px] text-accent opacity-55">{shareLog.balance==='yes'?'\u2728 balanced':shareLog.balance==='getting-there'?'\uD83D\uDE0C getting there':'\uD83D\uDE15 not quite'}</p>}</div>
          {shareLog.feelings&&shareLog.feelings.length>0&&<div className="flex flex-wrap gap-1 mb-3">{shareLog.feelings.map(function(f){var fe=FEELINGS.find(function(x){return x.label===f;});return <span key={f} className="font-sans text-[9px] text-accent bg-white/60 px-2 py-0.5 rounded-full">{fe?fe.emoji:''} {f}</span>;})}</div>}
          {shareLog.reflection&&<p className="font-serif text-[12px] text-body italic opacity-55">"{shareLog.reflection}"</p>}
        </div>
        <div className="bg-white px-6 py-4">
          <p className="font-sans text-[11px] text-body opacity-40 mb-3">share this moment</p>
          <div className="flex items-center gap-3">
            <button onClick={function(){handleSaveShareImage(shareLog);}} className="flex-1 flex flex-col items-center gap-1.5 py-3 rounded-[14px] border transition-all active:scale-[0.97]" style={{borderColor:'rgba(0,0,0,0.06)',background:'#FAF6F2'}}><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#614433" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M9 2v10M5 8l4 5 4-5M3 15h12"/></svg><span className="font-sans text-[9px] text-headline font-medium">Save Image</span></button>
            <button onClick={function(){handleShareText(shareLog);}} className="flex-1 flex flex-col items-center gap-1.5 py-3 rounded-[14px] border transition-all active:scale-[0.97]" style={{borderColor:'rgba(0,0,0,0.06)',background:'#FAF6F2'}}><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#614433" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M2 14c0 1.1.9 2 2 2h10a2 2 0 002-2V6.8a2 2 0 00-.6-1.4l-3.8-3.8A2 2 0 0010.2 1H4a2 2 0 00-2 2v11z"/><path d="M6 9l3 3 3-3"/></svg><span className="font-sans text-[9px] text-headline font-medium">iMessage</span></button>
            <button onClick={function(){handleShareText(shareLog);}} className="flex-1 flex flex-col items-center gap-1.5 py-3 rounded-[14px] border transition-all active:scale-[0.97]" style={{borderColor:'rgba(0,0,0,0.06)',background:'#FAF6F2'}}><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#614433" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="2" width="14" height="14" rx="4"/><circle cx="9" cy="9" r="3.5"/><circle cx="13.5" cy="4.5" r="0.5" fill="#614433"/></svg><span className="font-sans text-[9px] text-headline font-medium">IG Story</span></button>
          </div>
          <button onClick={function(){setShareLog(null);}} className="w-full font-sans text-[11px] text-body opacity-40 mt-3 text-center">cancel</button>
        </div>
      </div>
    </div>}
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
